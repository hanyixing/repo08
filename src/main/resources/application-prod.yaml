# Production profile. Activate with: SPRING_PROFILES_ACTIVE=prod
#
# Secrets are NOT hard-coded here: the database credentials are read from
# environment variables (set by docker-compose.yml or the host), so this file
# is safe to commit. Override per-host secrets via env vars or an (ignored)
# application-local.yaml — never bake passwords into version control.
server:
  port: 8090
  forward-headers-strategy: native
  compression:
    enabled: true
  error:
    include-message: always
spring:
  devtools:
    restart:
      enabled: false
  mvc:
    pathmatch:
      use-suffix-pattern: true
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
  output:
    ansi:
      enabled: never
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    # MySQL 8 — host/port/name/credentials come from the environment.
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${HALO_DB_HOST:127.0.0.1}:${HALO_DB_PORT:3306}/${HALO_DB_NAME:halo}?characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${HALO_DB_USERNAME:halo}
    password: ${HALO_DB_PASSWORD:please-change-me}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false
  flyway:
    enabled: false
  servlet:
    multipart:
      max-file-size: 10240MB
      max-request-size: 10240MB
      resolve-lazily: true
  data:
    redis:
      repositories:
        enabled: false
management:
  endpoints:
    web:
      base-path: /api/admin/actuator
      exposure:
        include: [ 'httptrace', 'metrics', 'env', 'logfile', 'health' ]
  health:
    redis:
      enabled: false
logging:
  level:
    run.halo.app: INFO
    org.eclipse.jetty.server.HttpChannel: ERROR
  file:
    path: ${halo.work-dir}/logs
springfox:
  documentation:
    enabled: false
halo:
  download-timeout: 5m
  auth-enabled: true
  mode: production
  # Fixed container/host path; mount a volume here for persistence.
  work-dir: /app/data/
  cache: memory
