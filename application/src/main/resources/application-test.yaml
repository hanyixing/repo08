server:
  port: 8090

spring:
  output:
    ansi:
      enabled: detect
  thymeleaf:
    cache: true
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 365d
  r2dbc:
    url: r2dbc:h2:file:///${halo.work-dir}/db/halo-test?MODE=MySQL&DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  sql:
    init:
      mode: always
      platform: h2

halo:
  work-dir: ${java.io.tmpdir}/halo2-test
  plugin:
    runtime-mode: deployment

logging:
  level:
    root: INFO
    run.halo: INFO
    org.springframework: WARN
  file:
    name: ${halo.work-dir}/logs/halo-test.log

springdoc:
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
